# Shell config
shell:
  pokeapi-url: "https://pokeapi.co/api/v2"
  storage-dir: "${user.dir}/data"
  debug: true
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
# Spring Properties
spring:
  application:
    name: ai2
  shell:
    context:
      close: true
    command:
      help:
        enabled: true
      version:
        enabled: true
        show-git-short-commit-id: true
  mustache:
    charset: UTF-8
    check-template-location: true
    suffix: ".md"
    prefix: classpath:/templates/
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: when_missing
        timeout: 10m
        max-retries: 3
        chat:
          additional-models:
            - "mistral"
            - "llama3.2"
            - "qwen2.5:0.5b"
            - "deepseek-r1:1.5b"
            - "deepseek-r1:8b"
            - "gemma3:4b"
        embedding:
          include: true
      chat:
        model: "llama3.2"
        temperature: 0.7
    chat:
      client:
        enabled: true
    mcp:
      client:
        enabled: true
        name: spring-ai-mcp-client
        toolcallback:
          enabled: true
        type: sync
        stdio:
          connections:
            filesystem:
              command: "npx"
              args:
                - "-y"
                - "@modelcontextprotocol/server-filesystem"
                - "--read-only"
                - "${shell.storage-dir}"